<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">二分法求近似根流程</title>
  <desc id="fig-desc">先验证区间端点异号，再取中点并计算函数值；若区间长度不小于容差，保留有根的一半并回到取中点；否则输出中点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="24" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827">二分法怎么走</text>

  <g font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="210" y="55" width="220" height="54" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="320" y="78">验证 f(a)·f(b) 小于 0</text>
    <text x="320" y="98">（端点异号保证有根）</text>

    <rect x="210" y="145" width="220" height="54" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="320" y="168">取中点 m，算 f(m)</text>
    <text x="320" y="188">中点把区间分成两半</text>

    <polygon points="320,230 430,275 320,320 210,275" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
    <text x="320" y="270">区间长度</text>
    <text x="320" y="290">小于容差？</text>

    <rect x="470" y="248" width="140" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="540" y="271">输出中点 m</text>
    <text x="540" y="291">停止</text>

    <rect x="30" y="248" width="140" height="54" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="100" y="271">保留有根</text>
    <text x="100" y="291">的一半</text>
  </g>

  <g stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <line x1="320" y1="109" x2="320" y2="143"/>
    <line x1="320" y1="199" x2="320" y2="228"/>
    <line x1="430" y1="275" x2="468" y2="275"/>
    <line x1="210" y1="275" x2="172" y2="275"/>
    <polyline points="100,248 100,172 208,172"/>
  </g>

  <g font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="450" y="266">是</text>
    <text x="190" y="266">否</text>
    <text x="100" y="160">回到取中点</text>
  </g>
  <text x="320" y="350" font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">读图顺序：从上到下；判断框只分“是/否”两支，虚线框表示回退步骤</text>
</svg>
