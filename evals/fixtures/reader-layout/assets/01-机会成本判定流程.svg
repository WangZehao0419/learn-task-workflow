<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">机会成本判定流程</title>
  <desc id="fig-desc">从左到右五步：列出可行选项，删除不可行项，按净收益排序，取次优价值，排除沉没成本。结论是只取可行选项中的次优价值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="240" fill="#ffffff"/>
  <text x="24" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827">机会成本怎么算</text>

  <g font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="25" y="70" width="110" height="70" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="80" y="98">列出所有</text>
    <text x="80" y="120">可行选项</text>

    <rect x="145" y="70" width="110" height="70" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="200" y="98">删除</text>
    <text x="200" y="120">不可行项</text>

    <rect x="265" y="70" width="110" height="70" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="320" y="98">按净收益</text>
    <text x="320" y="120">排序</text>

    <rect x="385" y="70" width="110" height="70" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
    <text x="440" y="98">取次优</text>
    <text x="440" y="120">价值</text>

    <rect x="505" y="70" width="110" height="70" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="560" y="98">排除</text>
    <text x="560" y="120">沉没成本</text>
  </g>

  <g stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="137" y1="105" x2="143" y2="105"/>
    <line x1="257" y1="105" x2="263" y2="105"/>
    <line x1="377" y1="105" x2="383" y2="105"/>
    <line x1="497" y1="105" x2="503" y2="105"/>
  </g>

  <text x="440" y="165" font-family="sans-serif" font-size="14" fill="#b45309" text-anchor="middle">关键判断：只取第二高</text>
  <text x="560" y="165" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">虚线：先排除</text>
  <text x="320" y="205" font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">读图顺序：从左到右；每一步都要保留判断依据</text>
</svg>
